[package]
name = "deepseek-ultrafast-glm"
version.workspace = true
edition.workspace = true

[lib]
name = "glm"
path = "src/lib.rs"

[[bin]]
name = "glm-serve"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["json"] }
deepseek-ultrafast-cuda = { path = "../cuda" }
glm-kernels = { path = "../glm-kernels" }
deepseek-ultrafast-model = { path = "../model" }
half.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
